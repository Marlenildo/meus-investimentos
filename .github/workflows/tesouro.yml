# Atualiza os dados do Tesouro Direto (preços e histórico de cada título) usados pelo app.
# Roda nos dias úteis, à noite, e guarda tudo no branch "dados" (fora da main, que fica limpa).
name: dados do Tesouro

on:
  schedule:
    - cron: '30 22 * * 1-5' # 19h30 em Brasília, depois que a ANBIMA publica o arquivo do dia
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados-tesouro
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - name: Abrir o branch de dados (cria na primeira vez)
        run: |
          git clone --depth 1 --branch dados "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dados \
            || (mkdir dados && cd dados && git init -q -b dados && git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git")
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install xlrd==2.0.1
      - name: Montar os dados
        run: python app/scripts/tesouro.py dados/tesouro
      - name: Guardar no branch de dados
        run: |
          cd dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -q -m "Tesouro: dados de $(date -u +%F)"
          git push -q origin dados
