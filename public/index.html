<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meus Investimentos</title>
  <meta name="description" content="Monte a compra do mês: aporte + proventos, preço atual de cada ativo, cotas e custo do banco.">
  <meta name="theme-color" content="#0a0b10">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>try{var t=localStorage.getItem("meus-investimentos:tema");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
  <header class="topo">
    <div class="topo-in">
      <a class="marca" href="#comprar" aria-label="Meus Investimentos — início">
        <img src="icone.svg" width="32" height="32" alt="">
        <span>Meus Investimentos</span>
      </a>
      <button type="button" id="tema" class="icone-btn" aria-label="Mudar tema"></button>
      <button type="button" id="nuvem" class="nuvem-st" hidden></button>
    </div>
  </header>

  <section class="boleta" id="boleta" aria-live="polite"></section>

  <nav class="abas" aria-label="Seções">
    <div class="abas-in">
      <a href="#comprar" data-aba="comprar">Comprar</a>
      <a href="#carteira" data-aba="carteira">Histórico</a>
      <a href="#proventos" data-aba="proventos">Proventos</a>
      <a href="#ajustes" data-aba="ajustes">Ajustes</a>
    </div>
  </nav>

  <main id="conteudo" class="conteudo"></main>

  <dialog id="dlg-registrar" class="dlg"></dialog>
  <dialog id="dlg-conta" class="dlg" aria-label="Sua conta"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
